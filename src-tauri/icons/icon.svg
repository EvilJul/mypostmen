<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- 背景渐变：indigo → purple → fuchsia -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    
    <!-- 箭头渐变 -->
    <linearGradient id="arrow-gradient" x1="280" y1="360" x2="760" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 星光发光 -->
    <filter id="sparkle-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="1024" height="1024" rx="240" fill="url(#bg-gradient)"/>
  
  <!-- 内边框高光 -->
  <rect x="2" y="2" width="1020" height="1020" rx="238" fill="none" 
        stroke="white" stroke-opacity="0.15" stroke-width="4"/>

  <!-- 主箭头 - 现代化纸飞机造型 -->
  <g filter="url(#glow)">
    <path
      d="M 280 360 L 760 512 L 280 664 L 360 540 L 600 512 L 360 484 Z"
      fill="url(#arrow-gradient)"
      opacity="0.98"
    />
    <!-- 箭头尾部细节线 -->
    <path
      d="M 280 360 L 360 484 L 320 440 Z"
      fill="white"
      opacity="0.3"
    />
    <path
      d="M 280 664 L 360 540 L 320 584 Z"
      fill="white"
      opacity="0.3"
    />
  </g>

  <!-- AI 星光组 - 右上角 -->
  <g filter="url(#sparkle-glow)">
    <!-- 主星 - 4点星形 -->
    <path 
      d="M 780 220 L 794 270 L 844 284 L 794 298 L 780 348 L 766 298 L 716 284 L 766 270 Z"
      fill="white" 
      opacity="0.95"
    />
    
    <!-- 中星 -->
    <path 
      d="M 690 170 L 698 196 L 724 204 L 698 212 L 690 238 L 682 212 L 656 204 L 682 196 Z"
      fill="white" 
      opacity="0.75"
    />
    
    <!-- 小星 -->
    <circle cx="840" cy="210" r="10" fill="white" opacity="0.6"/>
    <circle cx="730" cy="270" r="6" fill="white" opacity="0.5"/>
  </g>

  <!-- AI 星光组 - 左下角（平衡构图） -->
  <g filter="url(#sparkle-glow)" opacity="0.6">
    <path 
      d="M 240 780 L 248 804 L 272 812 L 248 820 L 240 844 L 232 820 L 208 812 L 232 804 Z"
      fill="white" 
      opacity="0.7"
    />
    <circle cx="290" cy="830" r="6" fill="white" opacity="0.5"/>
  </g>
</svg>
